template-handler:
  version: 1.x
  js:
    assets/js/template_functions.js: {}
    assets/js/app_shortcodes.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once
    - core/drupalSettings
    - core/ckeditor5

token-picker:
  # Bump this whenever token_picker.js changes: an explicit version makes
  # Drupal emit ?v=<version>, which the cache-busting query string does NOT
  # override, so browsers hold the old file through a cache rebuild.
  # (2026-09-06: opt-in multiSelect mode that copies a {%p for %} block;
  #  2026-09-06: the dropdown no longer closes on every selection, and two or
  #  more fields are joined with line() so a blank value takes its separator
  #  with it;
  #  2026-09-06: removing chips from the tray no longer re-opens the dropdown —
  #  it opens on the search box only.)
  version: '1.5'
  js:
    assets/js/token_picker.js: {}

