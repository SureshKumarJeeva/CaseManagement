docusign-library-form:
  # Bump on every docusign_library_form.js edit — an explicit version pins the
  # ?v= URL, which the global cache-busting string does NOT override, so
  # browsers hold the old file through a cache rebuild
  # (2026-08-10: upload method popup;
  #  2026-08-21: third card — edit in Word for the web via Microsoft 365;
  #  2026-08-22: dropped the untracked-node branch, the endpoint now refuses it;
  #  2026-08-22: "Edit … in Word (Microsoft 365)" re-edit button;
  #  2026-08-22: token panel above the form actions;
  #  2026-08-24: note when the editor will demand a Microsoft sign-in;
  #  2026-08-28: Done now CLOSES the Word tab BEFORE pulling — Word had not yet
  #  committed the edits, so a stale file was written back over the author's
  #  work while the message claimed nothing had changed;
  #  2026-08-29: Done sends the selected category, so the reload afterwards no
  #  longer comes back with an empty category that hides the file element;
  #  2026-08-29: the file-input change handler is DELEGATED — replacing the
  #  document on an existing template inserts a new input via Drupal AJAX, and
  #  a directly-bound handler was never on it, so nothing happened at all;
  #  2026-08-30: the Done panel is REBUILT from the server-side session on page
  #  load, so a reload no longer strips the Done button away for good; plus a
  #  4-hour editing-window note, since cron abandons a session after that;
  #  2026-09-06: the token panel opts in to multiSelect, so picking two fields
  #  copies a repeating block instead of two loose tokens;
  #  2026-09-28: no upload-method popup — a chosen .docx goes straight to
  #  Microsoft 365 and a non-.docx is refused with a message. FIRST UPLOAD shows
  #  an "Open in Word" button and opens the tab from that click, because a file
  #  input's change event carries no permission to open a tab; "Update document"
  #  still opens the tab immediately, since it runs from a real button click;
  #  2026-10-15: Invoice category — second token panel with the Invoice (Xero)
  #  tokens, shown only when Category = Invoice;
  #  2026-10-15: the Job token dropdown opens ABOVE the Invoice token panel).
  # Quoted: unquoted 2.0 is a YAML float and becomes "2" in the ?v= URL.
  version: '2.5'
  js:
    assets/js/docusign_library_form.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once
    # Supplies window.ApsTokenPicker for the authoring token panel.
    - associatedps_affidavit_template/token-picker
    - core/drupalSettings

docusign-docgen-editor:
  version: 1.0
  js:
    assets/js/docusign_docgen_editor.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - associatedps_affidavit_template/token-picker

docusign-docgen-envelope-editor:
  version: 1.0
