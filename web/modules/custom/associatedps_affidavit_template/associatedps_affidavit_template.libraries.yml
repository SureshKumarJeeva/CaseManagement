email-token-picker:
  # Bump this on any edit to email_token_picker.js/.css: an explicit version
  # makes Drupal emit ?v=<version>, which the cache-busting query string does
  # NOT override, so browsers hold the old file through a cache rebuild.
  version: 1.1
  css:
    theme:
      assets/css/email_token_picker.css: {}
  js:
    assets/js/email_token_picker.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once

docusign-generate:
  # Bump on every docusign_generate.js edit — an explicit version pins the ?v=
  # URL, which the global cache-busting string does NOT override, so browsers
  # hold the old file through a cache rebuild (2026-07-27: generate loader;
  # 2026-08-10: doc-gen aware messaging + template badge;
  #  2026-08-28: in-house Word merge branch — downloads the merged .docx via a
  #  synthetic anchor click, since window.open() in an async callback is eaten
  #  by popup blockers;
  #  2026-09-28: wording matches what actually happens — the overlay says the
  #  job's details are being merged into the template rather than that an
  #  envelope is being created, and the generic AJAX failure no longer blames
  #  envelope generation. The envelope/polling branches are unreachable now that
  #  the controller never defers to DocuSign;
  #  2026-09-28: EVERY Generate click opens the template picker first, fed by
  #  /word-template/templates/{category}/{jobId}, with the job's own template
  #  pre-selected — so confirming is one click and any other template can be used
  #  for this run without editing the job).
  version: '1.5'
  js:
    assets/js/docusign_generate.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/drupalSettings

