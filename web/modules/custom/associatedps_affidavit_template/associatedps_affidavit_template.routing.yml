associatedps_affidavit_template.save:
  path: /associatedps_affidavit_template/save
  defaults:
    _controller: Drupal\associatedps_affidavit_template\Controller\ConvertController::save
  requirements:
    _permission: 'access content'


associatedps_affidavit_template.pdf:
  path: /associatedps_affidavit_template/pdf
  defaults:
    _controller: Drupal\associatedps_affidavit_template\Controller\PdfController::download
  requirements: 
    _permission: 'access content'



associatedps_affidavit_template.upload_form:
  path: /associatedps_affidavit_template/upload
  defaults:
    _form: Drupal\associatedps_affidavit_template\Form\TemplateUploadForm
    _title: 'Upload and Edit Template'
  requirements:
    _permission: 'administer site configuration'


associatedps_affidavit_template.convert:
  path: /associatedps_affidavit_template/convert
  defaults:
    _controller: Drupal\associatedps_affidavit_template\Controller\ConvertController::convert
  requirements:
    _permission: 'access content'


associatedps_affidavit_template.list_templates:
  path: /admin/content/list-templates
  defaults:
    _controller: Drupal\associatedps_affidavit_template\Controller\TemplateListController::listTemplates
    _title: 'List of Templates'
  requirements:
    _permission: 'administer site configuration'

associatedps_affidavit_template.list_template_documents:
  path: /admin/content/list-template-documents
  defaults:
    _controller: Drupal\associatedps_affidavit_template\Controller\CustomTemplateDocuments::listTemplateDocuments
    _title: 'List of Template Documents'
  requirements:
    _permission: 'administer site configuration'

associatedps_affidavit_template.print_document_template:
  path: /admin/content/print_document_template/{id}
  defaults:
    _controller: Drupal\associatedps_affidavit_template\Controller\CustomTemplateDocuments::printDocumentTemplate
    _title: 'Document Template Details'
  requirements:
    _permission: 'administer site configuration'

associatedps_affidavit_template.save_document_template:
  path: /admin/content/save_document_template/{id}
  defaults:
    _controller: Drupal\associatedps_affidavit_template\Controller\CustomTemplateDocuments::savePrintDocumentTemplate
    _title: 'Document Template Store'
  requirements:
    _permission: 'administer site configuration'

associatedps_affidavit_template.xero_account_config:
  path: '/admin/config/associatedps/xero'
  defaults:
    _form: '\Drupal\associatedps_affidavit_template\Form\XeroAccountConfigForm'
    _title: 'Xero Account Configuration'
  requirements:
    _permission: 'administer site configuration'

associatedps_affidavit_template.xero_oauth_start:
  path: '/admin/config/associatedps/xero/authorize'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\XeroOAuthController::authorize'
  requirements:
    _permission: 'administer site configuration'


associatedps_affidavit_template.xero_oauth_callback:
  path: '/xero/oauth/callback'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\XeroOAuthController::callback'
  requirements:
    _access: 'TRUE'

associatedps_affidavit_template.xero_handle_tokens:
  path: '/xero/oauth/tokens'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\XeroOAuthController::handleTokens'
  requirements:
    _access: 'TRUE'

associatedps_affidavit_template.xero_generate_invoice:
  path: '/xero/generate-invoice/{jobId}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\XeroServices::generateInvoice'
  requirements:
    _access: 'TRUE'

# --- PandaDoc Routes ---

associatedps_affidavit_template.pandadoc_upload:
  path: '/admin/content/pandadoc/upload/{nid}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::uploadToPandaDoc'
    _title: 'Upload to PandaDoc'
  requirements:
    _permission: 'access content'

associatedps_affidavit_template.pandadoc_editor:
  path: '/admin/content/pandadoc/editor/{pandadocTemplateId}/{nid}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::editorPage'
    _title: 'PandaDoc Template Editor'
  requirements:
    _permission: 'access content'

associatedps_affidavit_template.pandadoc_editor_callback:
  path: '/admin/content/pandadoc/editor-callback'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::editorCallback'
    _title: 'PandaDoc Editor Callback'
  requirements:
    _permission: 'access content'

associatedps_affidavit_template.pandadoc_generate_affidavit:
  path: '/pandadoc/generate-affidavit/{jobId}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::generateAffidavit'
  requirements:
    _permission: 'access content'

associatedps_affidavit_template.pandadoc_generate_correspondence:
  path: '/pandadoc/generate-correspondence/{jobId}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::generateCorrespondence'
  requirements:
    _permission: 'access content'

associatedps_affidavit_template.pandadoc_status:
  path: '/pandadoc/status/{documentId}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::checkStatus'
  requirements:
    _permission: 'access content'

associatedps_affidavit_template.pandadoc_download:
  path: '/pandadoc/download/{documentId}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::downloadPdf'
