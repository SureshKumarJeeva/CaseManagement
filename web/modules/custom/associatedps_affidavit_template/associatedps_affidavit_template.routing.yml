associatedps_affidavit_template.pandadoc_document_editor:
  path: '/pandadoc/document-editor/{documentId}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::documentEditorPage'
    _title: 'PandaDoc Document Editor'
  requirements:
    _permission: 'access content'

associatedps_affidavit_template.pandadoc_document_session:
  path: '/pandadoc/document-session/{documentId}'
  defaults:
    _controller: '\Drupal\associatedps_affidavit_template\Controller\PandaDocController::createDocumentSessionAjax'
  requirements:
