associatedps_update_client.update_email:
  path: '/node/{node}/update-email'
  defaults:
    _controller: '\Drupal\associatedps_update_client\Controller\UpdateEmailController::send'
    _title: 'Update Email'
  requirements:
    _entity_access: 'node.view'
    _csrf_token: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node
