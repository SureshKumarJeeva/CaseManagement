global-styling:
  # Explicit version pins the ?v= URL (the global cache-busting string does not
  # override it) — bump on every style.css edit (2026-07-29: APS Admin main-nav dropdown).
  version: 1.3
  css:
    base:
      css/style.css: { weight : 200 }
global-scripts:
  # Bump on every js/*.js edit — an explicit version pins the ?v= URL, which the
  # cache-busting query string does not override (2026-08-01: stop hiding Party
  # To Serve tab for agents).
  version: 1.3
  js:
    js/moment.js: {}
    js/date.js: {}
    js/jQuery.print.js: {}
    js/script.js: {}
  dependencies:
    - core/jquery
    - core/once
  #  - core/jquery.once
    - core/drupalSettings
    - core/drupal.dialog.ajax
    - core/drupal.ajax
